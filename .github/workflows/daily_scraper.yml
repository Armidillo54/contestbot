name: ContestBot Daily Scraper

on:
  schedule:
    - cron: '17 9 * * 0'   # Sunday 5:17 AM EDT — weekly run
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily_scraper.yml'

permissions:
  contents: write

concurrency:
  group: contestbot-scraper
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper pipeline
        run: python run_all.py

      - name: Commit updated database
        run: |
          git config user.name 'ContestBot'
          git config user.email 'contestbot@users.noreply.github.com'
          git add -A
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "Auto-update: $(date -u +%Y-%m-%d) contest scan"
          git pull --no-rebase -X ours origin main
          git push origin main
